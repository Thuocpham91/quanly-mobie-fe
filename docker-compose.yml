services:
  quanly-mobie-fe-service:
    image: quanly-mobie-fe-service:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:9004/api/v1}
    container_name: quanly-mobie-fe-service
    ports:
      - "${FE_PORT}:80"
    restart: always
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - gasy-network

networks:
  gasy-network:
    name: gasy-network
    external: true
